<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-gnPtJTwK5xDB/h2T+DWZAlfkh9Vt0JqHH9HV/dXrcig='; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Page not found | Kevin Ley</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0e0d">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/styles.css?v=10">
</head>
<body>
<main class="contact">
  <div class="wrap">
    <h1 class="contact__title">This page is <em>broken</em>.</h1>
    <p class="contact__body">Not by me, this time. The page you asked for doesn't exist.</p>
    <p class="contact__actions"><a class="btn" href="/">Back to the start<span class="btn__arrow" aria-hidden="true">→</span></a></p>
  </div>
</main>
<!-- GitHub Pages serves this one page for every missing address. A missing
     address under /de/ or /fr/ gets the same message in that language. -->
<script>
(() => {
  const lang = location.pathname.split("/")[1];
  const t = {
    de: ["Diese Seite ist <em>kaputt</em>.", "Diesmal nicht von mir. Die Seite, die du suchst, gibt es nicht.", "Zurück zum Anfang", "Seite nicht gefunden"],
    fr: ["Cette page est <em>cassée</em>.", "Pas par moi, cette fois. La page demandée n’existe pas.", "Retour à l’accueil", "Page introuvable"]
  }[lang];
  if (!t) return;
  document.documentElement.lang = lang;
  document.title = t[3] + " | Kevin Ley";
  document.querySelector("h1").innerHTML = t[0];
  document.querySelector(".contact__body").textContent = t[1];
  const a = document.querySelector(".btn");
  a.href = "/" + lang + "/";
  a.firstChild.textContent = t[2];
})();
</script>
</body>
</html>
